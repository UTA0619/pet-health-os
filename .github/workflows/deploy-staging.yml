name: Deploy — Staging

on:
  push:
    branches: [staging]

concurrency:
  group: deploy-staging
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with: { version: "${{ env.PNPM_VERSION }}" }

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_APP_ENV: staging

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Run database migrations (staging)
        run: |
          supabase link --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy Edge Functions (staging)
        run: |
          supabase functions deploy analyze-pet-image --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          supabase functions deploy generate-health-score --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          supabase functions deploy run-anomaly-detection --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          supabase functions deploy send-health-alerts --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
          supabase functions deploy sync-baseline-model --project-ref ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

      - name: Deploy to Vercel (staging)
        run: |
          npx vercel deploy --env staging --token ${{ secrets.VERCEL_TOKEN }} \
            --scope ${{ secrets.VERCEL_TEAM_ID }} > deployment_url.txt
          echo "DEPLOYMENT_URL=$(cat deployment_url.txt)" >> $GITHUB_ENV

      - name: Smoke tests
        run: |
          HEALTH_STATUS=$(curl -s -o /dev/null -w "%{http_code}" $DEPLOYMENT_URL/api/health)
          if [ "$HEALTH_STATUS" != "200" ]; then
            echo "Health check failed: $HEALTH_STATUS"
            exit 1
          fi
          echo "Smoke test passed: $DEPLOYMENT_URL"

      - name: Notify Slack on success
        if: success()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          payload: |
            {"text": "✅ Staging deployed: ${{ env.DEPLOYMENT_URL }} — ${{ github.actor }} @ ${{ github.sha }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: Notify Slack on failure
        if: failure()
        uses: slackapi/slack-github-action@v3.0.3
        with:
          payload: |
            {"text": "🚨 Staging deploy FAILED — ${{ github.actor }} @ ${{ github.sha }} — ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
