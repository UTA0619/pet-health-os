name: AI Task
description: AI model, prompt engineering, or evaluation task
title: "[AI] "
labels: ["ai", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this template for tasks involving AI model changes, prompt engineering,
        anomaly detection tuning, or evaluation pipeline work.
        **Every AI PR must include eval results.**

  - type: dropdown
    id: ai_capability
    attributes:
      label: AI capability
      options:
        - Health Score Algorithm
        - Camera Analysis (GPT-4o Vision)
        - Anomaly Detection
        - Baseline Behavior Modeling
        - AI Explainability / Explanations
        - Confidence Scoring
        - Prompt Engineering
        - Evaluation Pipeline
        - AI Guardrails / Safety
        - Embedding / Semantic Search
        - Other
    validations:
      required: true

  - type: textarea
    id: current_behavior
    attributes:
      label: Current behavior
      description: What does the AI currently do in this area?
    validations:
      required: true

  - type: textarea
    id: desired_behavior
    attributes:
      label: Desired behavior
      description: What should it do after this change?
    validations:
      required: true

  - type: textarea
    id: evaluation_metrics
    attributes:
      label: Evaluation metrics
      description: How will we measure if this change is an improvement?
      value: |
        | Metric | Current | Target |
        |---|---|---|
        | Precision | | |
        | Recall | | |
        | F1 | | |
        | MAE (vs vet ground truth) | | |
        | False positive rate | | |

  - type: textarea
    id: prompt_changes
    attributes:
      label: Prompt / model changes
      description: Describe the prompt changes or model configuration changes

  - type: textarea
    id: test_cases
    attributes:
      label: Test cases
      description: |
        List specific test cases that should pass after this change.
        Include edge cases and adversarial inputs.
      value: |
        - [ ] Normal case:
        - [ ] Edge case:
        - [ ] Adversarial case:

  - type: textarea
    id: guardrails
    attributes:
      label: Guardrail verification
      description: Which guardrails must be verified after this change?
      value: |
        - [ ] No medical diagnoses in outputs
        - [ ] Disclaimer appended to all health outputs
        - [ ] User content XML-isolated in prompts
        - [ ] Prompt injection test suite passes (20 cases)
        - [ ] Confidence score present on all outputs
        - [ ] Fallback response works when AI times out

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: Critical"
        - "P1: High"
        - "P2: Medium"
        - "P3: Low"
    validations:
      required: true

  - type: input
    id: estimated_hours
    attributes:
      label: Estimated hours
      placeholder: "e.g. 6h"
