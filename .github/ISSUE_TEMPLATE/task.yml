name: Engineering Task
description: Standard engineering task — feature, chore, refactor, or infrastructure
title: "[TASK] "
labels: ["task", "needs-triage"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What needs to be built or changed, and why?
    validations:
      required: true

  - type: dropdown
    id: domain
    attributes:
      label: Domain
      multiple: true
      options:
        - frontend
        - backend
        - database
        - ai
        - auth
        - camera
        - notifications
        - payments
        - infra
        - mobile
        - analytics
        - security
    validations:
      required: true

  - type: textarea
    id: technical_requirements
    attributes:
      label: Technical requirements
      description: Specific technical constraints, APIs to use, performance requirements, etc.

  - type: textarea
    id: implementation_steps
    attributes:
      label: Implementation steps
      value: |
        - [ ]
        - [ ]
        - [ ]

  - type: textarea
    id: acceptance_criteria
    attributes:
      label: Acceptance criteria
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Other issues that must be completed first (reference with #number)

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - "P0: Critical"
        - "P1: High"
        - "P2: Medium"
        - "P3: Low"
    validations:
      required: true

  - type: dropdown
    id: milestone
    attributes:
      label: Milestone
      options:
        - "M0: Foundation (Days 1–3)"
        - "M1: MVP Week 1 (Days 1–7)"
        - "M2: MVP Week 2 (Days 8–14)"
        - "M3: Closed Beta"
        - "M4: Public Launch"
        - "M5: AI Optimization"

  - type: input
    id: estimated_hours
    attributes:
      label: Estimated hours
      placeholder: "e.g. 4h"

  - type: dropdown
    id: difficulty
    attributes:
      label: Difficulty
      options:
        - "XS — trivial (< 2h)"
        - "S — straightforward (2–4h)"
        - "M — moderate (4–8h)"
        - "L — complex (8–16h)"
        - "XL — very complex (> 16h, consider splitting)"
